[program:hermes-marketing-workflow-monitor]
command=/workspace/hermes-agent-plugin/control-plane/marketing-workflows/start-marketing-workflow-monitor.sh
directory=/workspace/hermes-agent-plugin
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=20
user=root
stdout_logfile=/opt/data/hermes/control-plane/marketing-workflows/monitor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
environment=MARKETING_WORKFLOW_DATABASE_FILE="/opt/data/hermes/control-plane/marketing-workflows/state.sqlite",MARKETING_WORKFLOW_ARTIFACT_ROOT="/opt/data/hermes/control-plane/marketing-workflows/artifacts",MARKETING_WORKFLOW_MONITOR_STATE_FILE="/opt/data/hermes/control-plane/marketing-workflows/monitor-state.json",MARKETING_WORKFLOW_MONITOR_INTERVAL_SECONDS="20"
