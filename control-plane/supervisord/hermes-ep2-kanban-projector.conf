[program:hermes-ep2-kanban-projector]
command=/workspace/hermes-agent-plugin/control-plane/ep2-kanban/start-projector.sh
directory=/workspace/hermes-agent-plugin
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=20
user=root
stdout_logfile=/opt/data/hermes/control-plane/ep2-kanban/projector.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true
environment=HERMES_EP2_KANBAN_PROJECT_PATH="/workspace/hermes-agent-plugin",HERMES_EP2_KANBAN_PROJECTOR_INTERVAL_SECONDS="15"
